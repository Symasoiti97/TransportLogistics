# TL local environment.
#   docker compose up -d                    — Seq only (log and trace receiver)
#   docker compose --profile infra up -d    — Seq + Postgres, PostGIS (OSM), Redis, Neo4j
# If Postgres/Redis/Neo4j already run on this machine, the infra profile is not needed.
# Ports can be overridden with environment variables (see the defaults below).

name: tl

services:
  seq:
    image: datalust/seq:2025
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Local environment without authentication: UI and HTTP API are open on localhost.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # UI, HTTP API and OTLP ingestion (/ingest/otlp/v1/logs, /ingest/otlp/v1/traces)
      - "127.0.0.1:${TL_SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data

  postgres:
    profiles: [infra]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tl-identity
    ports:
      - "127.0.0.1:${TL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgis-osm:
    profiles: [infra]
    image: postgis/postgis:17-3.5
    # The official image is published for amd64 only; on Apple Silicon it runs under emulation.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osm_locations
    ports:
      - "127.0.0.1:${TL_OSM_POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgis-osm-data:/var/lib/postgresql/data

  redis:
    profiles: [infra]
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TL_REDIS_PORT:-6379}:6379"

  neo4j:
    profiles: [infra]
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "127.0.0.1:${TL_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${TL_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data

volumes:
  seq-data:
  postgres-data:
  postgis-osm-data:
  neo4j-data:
